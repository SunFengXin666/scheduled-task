# ============================================================
#  GitHub Actions 定时任务模板
#  放置路径：仓库根目录 -> .github/workflows/scheduled-task.yml
# ============================================================

name: Scheduled Task

on:
  # 定时触发：cron 一律用 UTC，北京时间 = UTC + 8
  schedule:
    - cron: "0 0 * * *"

  # 手动触发：Actions 页 Run workflow
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只演练不产生副作用"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 执行任务脚本
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          echo "触发方式: ${{ github.event_name }}"
          echo "开始时间(UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
          python scripts/task.py

      - name: 上传运行产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-output-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
          retention-days: 7
